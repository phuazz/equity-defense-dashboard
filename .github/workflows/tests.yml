# Runs the offline test suite on every pull request and on every push to main.
# The same suite gates the daily refresh in update.yml; this workflow catches a
# breakage at review time rather than at the next scheduled run. It needs no
# secrets: the tests read only fixtures and this repository's own files.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt "pytest>=8"

      - name: Run offline tests
        run: python -m pytest tests -q
